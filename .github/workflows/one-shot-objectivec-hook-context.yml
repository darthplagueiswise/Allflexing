name: One-shot typed Objective-C hook context refactor

on:
  push:
    branches:
      - agent/consolidated-realtime-runtime
    paths:
      - .github/workflows/one-shot-objectivec-hook-context.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/consolidated-realtime-runtime
          fetch-depth: 0

      - name: Replace switch-local blocks with a typed retained context
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path("libflex/AllFLEXing/FLEXHookRegistry.m")
          workflow_path = Path(".github/workflows/one-shot-objectivec-hook-context.yml")
          text = source_path.read_text()

          marker = "AllFLEXing typed Objective-C hook context ABI 1"
          if marker in text:
              raise SystemExit("typed Objective-C hook context already exists")

          insertion_anchor = "NSString *FLEXHookSurfaceName(FLEXHookSurface surface) {"
          if text.count(insertion_anchor) != 1:
              raise SystemExit("unexpected hook-surface anchor count")

          helper = r'''__attribute__((used)) static const char kFLEXObjectiveCHookContextMarker[] =
              "AllFLEXing typed Objective-C hook context ABI 1";

          @interface FLEXObjectiveCHookContext : NSObject
          @property (nonatomic, strong, readonly) FLEXHookEntry *entry;
          @property (nonatomic, readonly) SEL selector;
          @property (atomic, assign) IMP original;
          - (instancetype)initWithEntry:(FLEXHookEntry *)entry selector:(SEL)selector;
          @end

          @implementation FLEXObjectiveCHookContext

          - (instancetype)initWithEntry:(FLEXHookEntry *)entry selector:(SEL)selector {
              NSParameterAssert(entry != nil);
              NSParameterAssert(selector != NULL);
              self = [super init];
              if (self) {
                  _entry = entry;
                  _selector = selector;
                  _original = NULL;
              }
              return self;
          }

          @end

          static IMP FLEXMakeObjectiveCBoolNoArgumentsReplacement(
              FLEXObjectiveCHookContext *context
          ) {
              return imp_implementationWithBlock(^BOOL(id receiver) {
                  FLEXHookEntry *entry = context.entry;
                  if (entry.effectiveEnabled) {
                      [entry recordOverrideHit];
                      return entry.forceValue;
                  }
                  [entry recordHit];
                  IMP original = context.original;
                  return original
                      ? ((BOOL (*)(id, SEL))original)(receiver, context.selector)
                      : NO;
              });
          }

          static IMP FLEXMakeObjectiveCBoolObjectArgumentReplacement(
              FLEXObjectiveCHookContext *context
          ) {
              return imp_implementationWithBlock(^BOOL(id receiver, id argument) {
                  FLEXHookEntry *entry = context.entry;
                  if (entry.effectiveEnabled) {
                      [entry recordOverrideHit];
                      return entry.forceValue;
                  }
                  [entry recordHit];
                  IMP original = context.original;
                  return original
                      ? ((BOOL (*)(id, SEL, id))original)(
                          receiver,
                          context.selector,
                          argument
                      )
                      : NO;
              });
          }

          static IMP FLEXMakeObjectiveCBoolIntegerArgumentReplacement(
              FLEXObjectiveCHookContext *context
          ) {
              return imp_implementationWithBlock(^BOOL(
                  id receiver,
                  uintptr_t argument
              ) {
                  FLEXHookEntry *entry = context.entry;
                  if (entry.effectiveEnabled) {
                      [entry recordOverrideHit];
                      return entry.forceValue;
                  }
                  [entry recordHit];
                  IMP original = context.original;
                  return original
                      ? ((BOOL (*)(id, SEL, uintptr_t))original)(
                          receiver,
                          context.selector,
                          argument
                      )
                      : NO;
              });
          }

          static IMP FLEXMakeObjectiveCReplacement(
              FLEXHookABI abi,
              FLEXObjectiveCHookContext *context
          ) {
              switch (abi) {
                  case FLEXHookABIObjCBoolNoArguments:
                      return FLEXMakeObjectiveCBoolNoArgumentsReplacement(context);
                  case FLEXHookABIObjCBoolObjectArgument:
                      return FLEXMakeObjectiveCBoolObjectArgumentReplacement(context);
                  case FLEXHookABIObjCBoolIntegerArgument:
                      return FLEXMakeObjectiveCBoolIntegerArgumentReplacement(context);
                  default:
                      return NULL;
              }
          }

          '''
          text = text.replace(insertion_anchor, helper + insertion_anchor, 1)

          legacy_start = "    __weak FLEXHookEntry *weakEntry = entry;"
          replacement_guard = "    if (!replacement) {"
          if text.count(legacy_start) != 1:
              raise SystemExit("unexpected legacy weak-entry block count")
          start = text.index(legacy_start)
          end = text.index(replacement_guard, start)

          replacement_setup = '''    FLEXObjectiveCHookContext *context =
              [[FLEXObjectiveCHookContext alloc] initWithEntry:entry
                                                      selector:selector];
              // Seed forwarding before the provider mutates dispatch. A target
              // call racing installation can still reach the displaced method.
              context.original = method_getImplementation(method);
              IMP replacement = FLEXMakeObjectiveCReplacement(entry.abi, context);

          '''
          text = text[:start] + replacement_setup + text[end:]

          install_anchor = "    BOOL installed = classMethod\n"
          if text.count(install_anchor) != 1:
              raise SystemExit("unexpected Objective-C install anchor count")
          text = text.replace(
              install_anchor,
              "    IMP original = NULL;\n" + install_anchor,
              1,
          )

          final_anchor = "    entry.original = original;"
          if text.count(final_anchor) != 1:
              raise SystemExit("unexpected original-assignment count")
          text = text.replace(
              final_anchor,
              "    context.original = original;\n" + final_anchor,
              1,
          )

          forbidden = (
              "__weak FLEXHookEntry *weakEntry",
              "__block IMP original",
              "case FLEXHookABIObjCBoolNoArguments: {",
          )
          for token in forbidden:
              if token in text:
                  raise SystemExit(f"legacy Objective-C hook construction remains: {token}")

          source_path.write_text(text)
          workflow_path.unlink()
          PY

      - name: Validate structural invariants
        shell: bash
        run: |
          test ! -e .github/workflows/one-shot-objectivec-hook-context.yml
          grep -Fq "AllFLEXing typed Objective-C hook context ABI 1" \
            libflex/AllFLEXing/FLEXHookRegistry.m
          grep -Fq "FLEXMakeObjectiveCReplacement(entry.abi, context)" \
            libflex/AllFLEXing/FLEXHookRegistry.m
          ! grep -Fq "__weak FLEXHookEntry *weakEntry" \
            libflex/AllFLEXing/FLEXHookRegistry.m
          ! grep -Fq "__block IMP original" \
            libflex/AllFLEXing/FLEXHookRegistry.m
          bash scripts/validate-runtime-host-isolation.sh
          bash scripts/validate-safe-launch.sh

      - name: Commit refactor and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add libflex/AllFLEXing/FLEXHookRegistry.m \
            .github/workflows/one-shot-objectivec-hook-context.yml
          git commit -m "Refactor Objective-C replacements into typed hook contexts"
          git push origin HEAD:agent/consolidated-realtime-runtime
