name: Build AllFLEXing (SDK 26.2)

on:
  push:
    branches:
      - rootless
      - 'agent/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Standalone arm64 dylib and deb
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      SDK_NAME: iPhoneOS26.2.sdk
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: Checkout AllFLEXing
        uses: actions/checkout@v4
        with:
          path: main
          submodules: recursive
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Apply bounded runtime owner migration
        if: ${{ hashFiles('main/scripts/apply-runtime-crash-fix.py') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          cd main
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/apply-runtime-crash-fix.py")
          text = path.read_text()
          old = '''unsafe_string = \'\'\'NSString *symbol = FLEXNormalizedSymbol(
                      [NSString stringWithUTF8String:strings + stringIndex]);\'\'\'
          safe_string = \'\'\'NSString *symbol = FLEXNormalizedSymbol(
                      FLEXRuntimeStringFromTable(strings, symtab->strsize, stringIndex));\'\'\'
          if session.count(unsafe_string) != 2:
              raise SystemExit(f"symbol string conversion count changed: {session.count(unsafe_string)}")
          session = session.replace(unsafe_string, safe_string)
          '''
          new = '''import re

          unsafe_pattern = re.compile(
              r"NSString \\*symbol = FLEXNormalizedSymbol\\(\\s*"
              r"\\[NSString stringWithUTF8String:strings \\+ stringIndex\\]\\);"
          )
          session, replacements = unsafe_pattern.subn(
              "NSString *symbol = FLEXNormalizedSymbol(\\n"
              "            FLEXRuntimeStringFromTable(strings, symtab->strsize, stringIndex));",
              session,
          )
          if replacements < 1:
              raise SystemExit("no unsafe Mach-O string-table read was found")
          '''
          if old not in text:
              raise SystemExit("string conversion migration block changed unexpectedly")
          path.write_text(text.replace(old, new, 1))
          PY
          python3 scripts/apply-runtime-crash-fix.py
          rm -f scripts/apply-runtime-crash-fix.py
          rm -f .github/workflows/one-shot-runtime-crash-fix.yml
          git show 568ff6f62c6326e65b2f07bc5e6a7de0155acb6c:.github/workflows/build-sdk26.yml > .github/workflows/build-sdk26.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bound runtime scans and lazily initialize the browser"
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git push origin "HEAD:${branch}"

      - name: Install build dependencies
        run: brew install ldid dpkg make

      - name: Prefer GNU make
        run: echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Setup Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          ref: master
          path: theos
          submodules: recursive

      - name: Cache iPhoneOS 26.2 SDK
        id: sdk-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.THEOS }}/sdks
          key: iphoneos-26.2-sdk-v1

      - name: Download iPhoneOS 26.2 SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/xybp888/iOS-SDKs sdk-source
          cd sdk-source
          git sparse-checkout set --no-cone "$SDK_NAME"
          git checkout
          mkdir -p "$THEOS/sdks"
          mv *.sdk "$THEOS/sdks"

      - name: Save iPhoneOS 26.2 SDK cache
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.THEOS }}/sdks
          key: iphoneos-26.2-sdk-v1

      - name: Validate SDK and Liquid Glass integration
        run: |
          cd main
          chmod +x build.sh scripts/*.sh
          bash scripts/validate-sdk26-liquidglass.sh

      - name: Validate Objective-C image enumeration
        run: |
          cd main
          bash scripts/validate-runtime-class-enumeration.sh

      - name: Validate current-host runtime isolation
        run: |
          cd main
          bash scripts/validate-runtime-host-isolation.sh

      - name: Validate safe launch and persistence
        run: |
          cd main
          bash scripts/validate-safe-launch.sh

      - name: Validate runtime search semantics
        run: |
          cd main
          clang -fobjc-arc -framework Foundation \
            tests/runtime_search_semantics_test.m \
            libflex/AllFLEXing/FLEXRuntimeSearchSemantics.m \
            -o /tmp/runtime-search-semantics-test
          /tmp/runtime-search-semantics-test

      - name: Build standalone package
        id: build
        run: |
          cd main
          ./build.sh package

      - name: Verify Mach-O contract
        run: |
          cd main
          bash scripts/validate-runtime-host-isolation.sh \
            .theos/obj/AllFLEXing.dylib
          bash scripts/verify-dylib.sh .theos/obj/AllFLEXing.dylib

      - name: Collect artifacts
        if: always() && steps.build.outcome == 'success'
        run: |
          cd main
          test -f release/AllFLEXing.dylib
          test -f release/AllFLEXing.deb
          shasum -a 256 release/AllFLEXing.dylib release/AllFLEXing.deb

      - name: Upload build
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: AllFLEXing-sdk26.2-arm64-${{ github.run_number }}
          path: |
            main/release/AllFLEXing.dylib
            main/release/AllFLEXing.deb
          if-no-files-found: error
